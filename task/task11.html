<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Task 11: Độ Dài Ban Ngày</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f7fb;
            color: #222;
        }
        .chart-box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #0f172a;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            background: #fef9e8;
        }
        .upload-area:hover {
            background: #fef0d3;
        }
        .grid line { stroke: #e5e7eb; }
        .grid path { stroke: none; }
        .axis text { font-size: 11px; fill: #555; }
        .d3-tooltip {
            position: absolute;
            background: #1e293b;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            line-height: 1.5;
        }
        .tooltip-date {
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }
        .hover-circle {
            pointer-events: none;
            transition: opacity 0.1s ease;
        }
        .note {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="chart-box">
        <div class="chart-title">Task 11: Mô Hình Phân Bố Độ Dài Ban Ngày Trung Bình Toàn Quốc</div>
        
        <div class="upload-area" id="uploadArea">
            📂 Click hoặc kéo thả file CSV (df_weather_fixed_utf8_cleaned.csv)
        </div>
        <input type="file" id="fileInput" accept=".csv" style="display: none;">
        
        <div id="noDataMsg" style="text-align:center; padding:40px; color:#888;">
            ⬆️ Hãy chọn file CSV để vẽ biểu đồ
        </div>
        
        <svg id="daylightChart" width="840" height="420" style="display:none;"></svg>
        <div id="tooltip" class="d3-tooltip"></div>
        <div class="note">🔍 Hover chuột để xem chi tiết độ dài ngày</div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.onclick = () => fileInput.click();
        uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#e67e22'; };
        uploadArea.ondragleave = () => uploadArea.style.borderColor = '#f59e0b';
        uploadArea.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => drawChart(ev.target.result);
            reader.readAsText(file, 'UTF-8');
        }

        function drawChart(csvText) {
            // 1. CẤU HÌNH KÍCH THƯỚC KHUNG VẼ
            const svg = d3.select("#daylightChart");
            svg.style("display", "block");
            document.getElementById('noDataMsg').style.display = 'none';
            
            const width = +svg.attr("width");
            const height = +svg.attr("height");
            svg.selectAll("*").remove();
            
            const margin = { top: 20, right: 30, bottom: 40, left: 60 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

            const parseDate = d3.timeParse("%m/%d/%Y");
            const formatDate = d3.timeFormat("%d/%m/%Y");

            function timeToMinutes(timeStr) {
                if (!timeStr) return 0;
                const parts = String(timeStr).trim();
                const match = parts.match(/(\d+):(\d+)\s*(AM|PM)/i);
                if (match) {
                    let h = parseInt(match[1]), m = parseInt(match[2]), ap = match[3].toUpperCase();
                    if (ap === 'PM' && h !== 12) h += 12;
                    if (ap === 'AM' && h === 12) h = 0;
                    return h * 60 + m;
                }
                return 0;
            }

            // 2. XỬ LÝ DỮ LIỆU TỪ CSV
            const lines = csvText.split(/\r?\n/);
            const headers = lines[0].split(',').map(h => h.replace(/["']/g, '').trim());
            const idxSunrise = headers.indexOf('astro.sunrise');
            const idxSunset = headers.indexOf('astro.sunset');
            const idxDate = headers.indexOf('date');

            if (idxSunrise === -1 || idxSunset === -1 || idxDate === -1) {
                alert("Không tìm thấy cột cần thiết (astro.sunrise, astro.sunset, date)");
                return;
            }

            let cleanedData = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].trim();
                if (!row) continue;
                const cols = row.split(',');
                const dateRaw = cols[idxDate];
                const sunrise = timeToMinutes(cols[idxSunrise]);
                const sunset = timeToMinutes(cols[idxSunset]);
                const parsed = parseDate(dateRaw);
                if (parsed && sunrise > 0 && sunset > sunrise) {
                    cleanedData.push({
                        date: parsed,
                        dayLength: (sunset - sunrise) / 60
                    });
                }
            }

            if (cleanedData.length === 0) {
                alert("Không có dữ liệu hợp lệ");
                return;
            }

            // Gộp nhóm theo ngày
            const nestedData = d3.rollups(cleanedData,
                v => d3.mean(v, d => d.dayLength),
                d => d.date
            ).map(([date, avgLength]) => ({
                date: date,
                dayLength: avgLength
            })).sort((a, b) => a.date - b.date);

            // 3. THIẾT LẬP THANG ĐO
            const x = d3.scaleTime()
                .domain(d3.extent(nestedData, d => d.date))
                .range([0, innerWidth]);

            const minLen = d3.min(nestedData, d => d.dayLength);
            const maxLen = d3.max(nestedData, d => d.dayLength);
            
            const y = d3.scaleLinear()
                .domain([minLen - 0.2, maxLen + 0.2])
                .range([innerHeight, 0]);

            // 4. GRADIENT
            const defs = svg.append("defs");
            const gradient = defs.append("linearGradient")
                .attr("id", "area-gradient")
                .attr("x1", "0%").attr("y1", "0%")
                .attr("x2", "0%").attr("y2", "100%");
            gradient.append("stop").attr("offset", "0%").attr("stop-color", "#f59e0b").attr("stop-opacity", 0.5);
            gradient.append("stop").attr("offset", "100%").attr("stop-color", "#f59e0b").attr("stop-opacity", 0.05);

            // 5. VẼ LƯỚI & TRỤC
            g.append("g").attr("class", "grid").call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""));
            g.append("g").attr("transform", `translate(0, ${innerHeight})`).attr("class", "axis").call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat("%d/%m")));
            g.append("g").attr("class", "axis").call(d3.axisLeft(y).tickFormat(d => d.toFixed(1) + "h"));

            // 6. AREA & LINE
            const areaGenerator = d3.area()
                .x(d => x(d.date))
                .y0(innerHeight)
                .y1(d => y(d.dayLength))
                .curve(d3.curveMonotoneX);

            const lineGenerator = d3.line()
                .x(d => x(d.date))
                .y(d => y(d.dayLength))
                .curve(d3.curveMonotoneX);

            g.append("path")
                .datum(nestedData)
                .attr("fill", "url(#area-gradient)")
                .attr("d", areaGenerator);

            g.append("path")
                .datum(nestedData)
                .attr("fill", "none")
                .attr("stroke", "#f59e0b")
                .attr("stroke-width", 2.5)
                .attr("d", lineGenerator);

            // 7. TƯƠNG TÁC HOVER
            const hoverCircle = g.append("circle")
                .attr("class", "hover-circle")
                .attr("r", 5)
                .attr("fill", "#f59e0b")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", 2)
                .style("opacity", 0);

            g.append("rect")
                .attr("width", innerWidth)
                .attr("height", innerHeight)
                .style("fill", "none")
                .style("pointer-events", "all")
                .on("mouseover", () => {
                    d3.select("#tooltip").style("opacity", 1);
                    hoverCircle.style("opacity", 1);
                })
                .on("mouseout", () => {
                    d3.select("#tooltip").style("opacity", 0);
                    hoverCircle.style("opacity", 0);
                })
                .on("mousemove", function(event) {
                    const mouseX = d3.pointer(event, this)[0];
                    const xDate = x.invert(mouseX);
                    const bisect = d3.bisector(d => d.date).left;
                    const idx = bisect(nestedData, xDate, 1);
                    const d0 = nestedData[idx - 1];
                    const d1 = nestedData[idx];
                    let dData = d0;
                    if (d1 && xDate - d0.date > d1.date - xDate) dData = d1;
                    if (!dData) return;

                    hoverCircle.attr("cx", x(dData.date)).attr("cy", y(dData.dayLength));
                    const h = Math.floor(dData.dayLength);
                    const m = Math.round((dData.dayLength - h) * 60);

                    d3.select("#tooltip")
                        .style("left", (event.pageX - document.querySelector('.chart-box').offsetLeft + 15) + "px")
                        .style("top", (event.pageY - document.querySelector('.chart-box').offsetTop - 40) + "px")
                        .html(`
                            <div class="tooltip-date">${formatDate(dData.date)}</div>
                            <div>Thời gian chiếu sáng: <strong style="color:#f59e0b;">${h} giờ ${m} phút</strong></div>
                        `);
                });
        }
    </script>
</body>
</html>
